# 補助金収集対象の設定ファイル
#
# jgrants:
#   keywords:        検索キーワード（OR検索。各キーワードで個別にAPIを叩き重複排除）
#   target_areas:    補助対象地域フィルタ。47都道府県＋東京23区を初期登録。
#                    追加・削除はこのリストを編集するだけで反映される。
#   include_no_area: target_area未設定（全国対象）の補助金も収集するか
#
# custom_sites:
#   url:    監視対象URL
#   parser: src/parsers/ 配下のモジュール名（拡張子なし）
#
# 自治体独自サイトを追加する手順は README.md の「自治体追加手順」を参照。

jgrants:
  keywords:
    - 補助金
    - 助成金
    - 奨励金
  include_no_area: true
  target_areas:
